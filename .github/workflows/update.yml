name: Track mihomo releases

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compare with the latest mihomo release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current="$(sed -n 's/^ARG MIHOMO_VERSION="\(.*\)"$/\1/p' Dockerfile)"
          latest="$(gh api repos/MetaCubeX/mihomo/releases/latest --jq .tag_name)"
          echo "mihomo: $current -> $latest"

          if [ "$current" = "$latest" ]; then
            echo "Everything is up to date"
            exit 0
          fi

          sed -i "s/^ARG MIHOMO_VERSION=\".*\"$/ARG MIHOMO_VERSION=\"$latest\"/" Dockerfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Upgrade mihomo to $latest"
          git push origin HEAD:main
